# La barre de navigation, en deux groupes separes visuellement.
# Une entree peut porter un sous-menu ('sous'), revele au survol et au clavier
# sur grand ecran, et simplement affiche en retrait sur petit ecran.
# L'url doit correspondre exactement au permalink de la page, sinon l'etat
# 'page courante' ne s'allume pas.
- groupe: "Les listes"
  entrees:
    - titre: "Stratèges"
      url: /strateges/
      sous:
        - titre: "Dossiers stratèges"
          url: /dossiers-strateges/
    - titre: "Tacticiens"
      url: /tacticiens/
      sous:
        - titre: "Dossiers tacticiens"
          url: /dossiers-tacticiens/
- groupe: "L’appareil critique"
  entrees:
    - titre: "Matrice croisée"
      url: /matrice/
    - titre: "Arbitrages"
      url: /arbitrages/
    - titre: "Méthodologie"
      url: /methodologie/
    - titre: "Sources"
      url: /sources/
