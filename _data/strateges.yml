# 'cran' traduit le libelle de confiance sur une echelle a cinq crans :
#   1 faible a moyenne, 2 moyenne, 3 moyenne a elevee, 4 elevee, 5 tres elevee.
- rang: 1
  nom: "Gengis Khan"
