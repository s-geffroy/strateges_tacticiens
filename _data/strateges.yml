  profil: "Fondateur d’empire et architecte politico-militaire."
  cas: "Unification mongole puis campagnes contre les Xia occidentaux, les Jin et le Khwarezm."
  avantage: "Système combinant mobilité, discipline, renseignement, commandement décentralisé, intégration des spécialistes et terreur instrumentale."
